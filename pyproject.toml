[project]
name = "netspeed"
version = "1.0.0"
description = "Console tool that measures download speed with sequential HTTP requests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# PLR2004 enforces the "no magic numbers" rule for the package itself.
select = ["E", "F", "I", "B", "UP", "SIM", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
strict = true
files = ["netspeed", "tests"]
